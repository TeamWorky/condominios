<div class="sidebar-content">
  <div class="sidebar-header">
    <mat-icon class="logo-icon">apartment</mat-icon>
    <h2 class="logo-text">Condominio</h2>
  </div>

  <mat-divider></mat-divider>

  <mat-nav-list>
    @for (item of menuItems; track item.route) {
      <a
        mat-list-item
        [routerLink]="item.route"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{exact: item.route === '/dashboard'}"
      >
        <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
        <span matListItemTitle>{{ item.label }}</span>
        @if (item.badge && item.badge > 0) {
          <span matListItemMeta class="badge" [matBadge]="item.badge" matBadgeColor="warn" matBadgeSize="small"></span>
        }
      </a>
    }
  </mat-nav-list>

  <div class="sidebar-footer">
    <mat-divider></mat-divider>
    <p class="version-text">Versión 0.1.0</p>
  </div>
</div>
