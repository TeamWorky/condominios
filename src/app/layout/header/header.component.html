<header class="bg-white shadow-sm border-b border-gray-200">
  <div class="flex items-center justify-between px-6 py-4">
    <!-- Left Section: Menu Toggle -->
    <div class="flex items-center space-x-4">
      <button
        (click)="onToggleSidebar()"
        class="p-2 rounded-lg hover:bg-gray-100 transition-colors"
        aria-label="Toggle sidebar"
      >
        <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>

      <h1 class="text-xl font-semibold text-gray-800">Sistema de Gestión de Condominios</h1>
    </div>

    <!-- Right Section: User Menu -->
    <div class="flex items-center space-x-4">
      <!-- Notifications -->
      <button class="p-2 rounded-lg hover:bg-gray-100 transition-colors relative">
        <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
        </svg>
        <span class="absolute top-1 right-1 block h-2 w-2 rounded-full bg-red-500"></span>
      </button>

      <!-- User Avatar -->
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-full bg-primary-600 flex items-center justify-center">
          <span class="text-white font-medium text-sm">{{ userName.charAt(0) }}</span>
        </div>
        <span class="text-sm font-medium text-gray-700">{{ userName }}</span>
      </div>
    </div>
  </div>
</header>
